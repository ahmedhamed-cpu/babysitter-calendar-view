<style>
  :root{
    --ink:#1A2238;         /* Valeo navy (matches dashboard) */
    --ink-soft:#2b3654;
    --paper:#F7F5F0;       /* soft warm paper */
    --cream:#FBF9F4;
    --gold:#F6BD22;        /* Valeo gold (matches dashboard) */
    --gold-deep:#B8860B;
    --gold-soft:#FBEFC8;
    --sage:#4C7A63;        /* calm caregiving green accent */
    --sage-soft:#E9F1EC;
    --line:#E7E1D4;
    --muted:#5b6478;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
  .display{font-family:'Fraunces',Georgia,serif}
  .card-lift{transition:transform .22s cubic-bezier(.2,.8,.2,1), box-shadow .22s ease}
  .card-lift:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(31,42,68,.13)}
  .fade-in{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .sel-check{position:absolute;top:10px;left:10px;z-index:5;width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.92);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .sel-check input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;margin:0}
  .sel-mark{color:var(--muted);font-weight:800;font-size:15px;opacity:.35;transition:.15s}
  .sel-check input:checked ~ .sel-mark{color:var(--sage);opacity:1}
  .sel-check:has(input:checked){background:var(--sage-soft);border-color:var(--sage)}
  #sel-bar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:20px;z-index:50;transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
  #sel-bar.show{transform:translateX(-50%) translateY(0)}
  .stagger>*{opacity:0;animation:fade .5s ease forwards}
  .avatar-ring{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--sage)}
  .skill-chip{background:var(--sage-soft);color:var(--sage);border:1px solid #d3e4d9}
  .hero-card{border-radius:24px}
  .card-lift{border-radius:20px}
  .btn-primary{background:var(--ink);color:#fff;transition:filter .15s ease}
  .btn-primary:hover{filter:brightness(1.15)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  .star{color:var(--gold)}
</style>
</head>
<body>
<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 backdrop-blur" style="background:rgba(26,34,56,.97);border-bottom:2px solid var(--gold)">

<!-- ============ FIREBASE + APP ============ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// ---- Firebase config (same project; public page only ever READS publicProfiles) ----
const firebaseConfig = {
  apiKey: "REPLACE_WITH_WEB_API_KEY",
  authDomain: "bs-calendar-view.firebaseapp.com",
  projectId: "bs-calendar-view",
  storageBucket: "bs-calendar-view.appspot.com"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = "publicProfiles";
const REQUESTS = "profileRequests";
const TICKET_WEBHOOK = "https://feelvaleo.app.n8n.cloud/webhook/babysitter-ticket"; // notifies sales on Slack

// Standard packages for the request form dropdown
const REQUEST_PACKAGES = [
  "Hourly Babysitting : 4 Hours",
  "Hourly Babysitting : 6 Hours",
  "Hourly Babysitting : 8 Hours",
  "Hourly Babysitting : 10 Hours",
  "Weekly plan",
  "Monthly plan",
  "Elderly Care",
  "Other / not sure"
];
const REQUEST_SLOTS = ["Morning (8AM-12PM)","Afternoon (12PM-4PM)","Evening (4PM-8PM)","Night (8PM-12AM)","Full day","Flexible"];
let reqLocation = null;   // {lat, lng, url}
const selected = new Map();   // id -> name

// ----- Multi-select on the gallery -----
window.toggleSelect = function(box){
  if (box.checked) selected.set(box.getAttribute("data-id"), box.getAttribute("data-name"));
  else selected.delete(box.getAttribute("data-id"));
  updateSelBar();
};
window.clearSelection = function(){
  selected.clear();
  document.querySelectorAll(".sel-box").forEach(b => b.checked = false);
  updateSelBar();
};
function updateSelBar(){
  const bar = document.getElementById("sel-bar"), cnt = document.getElementById("sel-count");
  if (!bar) return;
  if (selected.size > 0){ cnt.textContent = selected.size + (selected.size===1?" caregiver selected":" caregivers selected"); bar.classList.add("show"); }
  else bar.classList.remove("show");
}
window.requestSelected = function(){
  if (selected.size === 0) return;
  const list = [...selected.entries()].map(([id,name]) => ({ id, name }));
  openRequestForm(list);
};

// Single-caregiver entry point (from a profile page) reuses the same form.
window.requestCaregiver = function(profileId, profileName){
  openRequestForm([{ id: profileId, name: profileName }]);
};

// Step 1: open the details form for one OR several caregivers.
function openRequestForm(caregivers){
  reqLocation = null;
  const multi = caregivers.length > 1;
  const title = multi ? `Request ${caregivers.length} caregivers` : `Request ${esc(caregivers[0].name)}`;
  const chips = multi ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${caregivers.map(c=>`<span style="background:var(--sage-soft);color:var(--sage);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px">${esc(c.name)}</span>`).join("")}</div>` : "";
  const today = new Date().toISOString().slice(0,10);
  const overlay = document.createElement("div");
  overlay.id = "req-overlay";
  overlay.style.cssText = "position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(26,34,56,.55);backdrop-filter:blur(3px);overflow-y:auto";
  overlay.innerHTML = `
    <div class="fade-in" style="max-width:460px;width:100%;background:var(--card);border-radius:22px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);margin:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div class="display" style="font-size:1.3rem;font-weight:700;color:var(--ink)">${title}</div>
        <button id="req-x" style="background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1">&times;</button>
      </div>
      <p style="color:var(--muted);font-size:13px;margin-bottom:${multi?"10px":"14px"}">${multi?"Our team will check availability across your selected caregivers and confirm with you.":"Share a few details and our team will confirm availability with you."}</p>
      ${chips}
      <div style="display:grid;gap:10px">
        <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Your name *</label><input id="rf-name" style="width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font-size:14px" /></div>
        <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Email *</label><input id="rf-email" type="email" style="width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font-size:14px" /></div>
        <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Phone</label><input id="rf-phone" type="tel" style="width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font-size:14px" /></div>
        <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Package</label>
          <select id="rf-package" style="width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:#fff">${REQUEST_PACKAGES.map(p=>`<option>${esc(p)}</option>`).join("")}</select></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Date</label><input id="rf-date" type="date" min="${today}" value="${today}" style="width:100%;height:42px;padding:0 10px;border:1px solid var(--line);border-radius:11px;font-size:14px" /></div>
          <div><label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Time slot</label><select id="rf-slot" style="width:100%;height:42px;padding:0 8px;border:1px solid var(--line);border-radius:11px;font-size:14px;background:#fff">${REQUEST_SLOTS.map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>
        </div>
        <div>
          <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:3px">Your location * (so we can serve you)</label>
          <button id="rf-loc-btn" type="button" style="width:100%;height:44px;border:1px dashed var(--sage);border-radius:11px;background:var(--sage-soft);color:var(--sage);font-weight:600;font-size:14px;cursor:pointer">📍 Share my location</button>
          <div id="rf-loc-status" style="font-size:12px;margin-top:5px;color:var(--muted)"></div>
        </div>
      </div>
      <p id="rf-err" style="display:none;color:#dc2626;font-size:13px;margin-top:10px"></p>
      <button id="rf-submit" style="width:100%;margin-top:16px;background:var(--ink);color:#fff;border:none;border-radius:13px;padding:13px;font-weight:600;font-size:15px;cursor:pointer">Submit request</button>
    </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById("req-x").addEventListener("click", close);
  overlay.addEventListener("click", e => { if(e.target===overlay) close(); });

  // GPS capture
  document.getElementById("rf-loc-btn").addEventListener("click", () => {
    const st = document.getElementById("rf-loc-status");
    if (!navigator.geolocation){ st.textContent = "Location not supported on this device — please type your area in the notes."; return; }
    st.textContent = "Getting your location…";
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude.toFixed(6), lng = pos.coords.longitude.toFixed(6);
        reqLocation = { lat, lng, url: `https://maps.google.com/?q=${lat},${lng}` };
        document.getElementById("rf-loc-btn").textContent = "✓ Location captured";
        document.getElementById("rf-loc-btn").style.background = "#e7f0ea";
        st.innerHTML = `Location saved · <a href="${reqLocation.url}" target="_blank" style="color:var(--sage);text-decoration:underline">view</a>`;
      },
      err => { st.textContent = "Couldn't get location ("+err.message+"). Please allow location access and retry."; },
      { enableHighAccuracy:true, timeout:10000 }
    );
  });

  document.getElementById("rf-submit").addEventListener("click", () => submitRequest(caregivers, close));
}

function submitRequest(caregivers, close){
  const g = id => document.getElementById(id);
  const err = g("rf-err");
  const name = g("rf-name").value.trim(), email = g("rf-email").value.trim();
  const phone = g("rf-phone").value.trim(), pkg = g("rf-package").value, date = g("rf-date").value, slot = g("rf-slot").value;
  if (!name){ err.textContent = "Please enter your name."; err.style.display="block"; return; }
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent = "Please enter a valid email."; err.style.display="block"; return; }
  if (!reqLocation){ err.textContent = "Please share your location (tap the button above)."; err.style.display="block"; return; }
  err.style.display="none";
  const btn = g("rf-submit"); btn.disabled=true; btn.textContent="Sending…";
  const id = "REQ-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,6);
  const names = caregivers.map(c=>c.name).join(", ");
  const ids = caregivers.map(c=>c.id).join(", ");
  const label = caregivers.length>1 ? "Caregivers ("+caregivers.length+"): " : "Caregiver: ";
  const msg = `New customer request from the public gallery.
${label}${names} (${ids})
Customer: ${name}
Email: ${email}
Phone: ${phone||"—"}
Package: ${pkg}
When: ${date} · ${slot}
Location: ${reqLocation.url} (${reqLocation.lat}, ${reqLocation.lng})
Please follow up via Freshchat to confirm availability.`;
  try {
    const payload = { ticketId:id, kind:"profile_request", direction:"to_ops", route:"ops",
      category:"Customer profile request", subject:"Request: "+names+" — "+name,
      message: msg,
      profileId: ids, profileName: names, caregiverCount: caregivers.length,
      customerName:name, customerEmail:email, customerPhone:phone, package:pkg, date, slot,
      locationUrl:reqLocation.url, lat:reqLocation.lat, lng:reqLocation.lng };
    fetch(TICKET_WEBHOOK, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body: JSON.stringify(payload) }).catch(()=>{});
  } catch(e){}
  // Minimal record for the dashboard Requests inbox (tiny doc; also a backup if Slack misses one).
  try {
    setDoc(doc(db, REQUESTS, id), {
      requestId:id, caregivers: caregivers.map(c=>({id:c.id,name:c.name})), caregiverNames:names,
      customerName:name, customerEmail:email, customerPhone:phone,
      package:pkg, date, slot, locationUrl:reqLocation.url,
      status:"new", createdAt:new Date().toISOString()
    }).catch(()=>{});
  } catch(e){}
  close();
  clearSelection();
  showThankYou(names);
}

function showThankYou(name){
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(26,34,56,.55);backdrop-filter:blur(3px)";
  overlay.innerHTML = `
    <div class="fade-in" style="max-width:440px;width:100%;background:var(--card);border-radius:24px;padding:32px 28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3)">
      <div style="width:64px;height:64px;border-radius:999px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:var(--sage-soft);font-size:30px">✓</div>
      <div class="display" style="font-size:1.6rem;font-weight:700;color:var(--ink)">Great choice!</div>
      <p style="margin-top:10px;color:var(--muted);line-height:1.55;font-size:15px">
        Thank you for choosing <b style="color:var(--ink)">${esc(name)}</b>. Our team will review your request and reach out shortly to confirm availability and next steps.
      </p>
      <p style="margin-top:8px;color:var(--muted);font-size:13px">Feel free to browse and add another caregiver too.</p>
      <button id="ty-home" style="margin-top:20px;width:100%;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:13px;font-weight:600;font-size:15px;cursor:pointer">Browse more caregivers</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("ty-home").addEventListener("click", ()=>{ overlay.remove(); location.hash = "#/gallery"; });
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay){ overlay.remove(); location.hash="#/gallery"; } });
}

const app_el = document.getElementById("app");
const backLink = document.getElementById("back-link");
const auth = getAuth(app);
let ADMIN_MODE = false;   // true only when signed in as a real admin (rules enforce writes)

// Optional staff mode: open the page with #admin to sign in and reveal remove controls.
onAuthStateChanged(auth, async (user) => {
  if (user) {
    try { const tok = await user.getIdTokenResult(); ADMIN_MODE = (tok.claims.role === "admin" || tok.claims.role === "support"); }
    catch(e){ ADMIN_MODE = false; }
  } else ADMIN_MODE = false;
  if (ADMIN_MODE) document.body.setAttribute("data-admin","1");
  router();
});

window.staffSignIn = async function(){
  const email = prompt("Valeo staff email:"); if(!email) return;
  const pass = prompt("Password:"); if(!pass) return;
  try { await signInWithEmailAndPassword(auth, email.trim(), pass); }
  catch(e){ alert("Sign-in failed: " + (e.code||e.message)); }
};

window.unpublishProfile = async function(id, name){
  if (!ADMIN_MODE) return;
  if (!confirm("Remove \""+name+"\" from the public gallery?")) return;
  try {
    await setDoc(doc(db, "publicProfiles", id), { published:false, updatedAt:new Date().toISOString() }, { merge:true });
    alert(name + " removed from the public gallery.");
    location.hash = "#/gallery"; router();
  } catch(e){ alert("Could not remove (need admin sign-in): " + (e.code||e.message)); }
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------- tiny hash router ----------
function router(){
  const hash = location.hash || "#/gallery";
  if (/[#&]admin/.test(hash) && !ADMIN_MODE) { window.staffSignIn(); return; }
  const m = hash.match(/^#\/p\/(.+)$/);
  if (m) { backLink.classList.remove("hidden"); renderProfile(decodeURIComponent(m[1])); }
  else { backLink.classList.add("hidden"); renderGallery(); }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", router);

function stars(r){
  const full = Math.round(r||0);
  return `<span class="star" aria-label="${(r||0)} out of 5">${"★".repeat(full)}<span style="color:var(--line)">${"★".repeat(5-full)}</span></span>`;
}
function loading(msg){ app_el.innerHTML = `<div class="py-24 text-center" style="color:var(--muted)">${esc(msg||"Loading…")}</div>`; }
function errorMsg(msg){ app_el.innerHTML = `<div class="py-24 text-center"><div class="display text-2xl mb-2">Nothing to show</div><div style="color:var(--muted)">${esc(msg)}</div></div>`; }

// ---------- GALLERY ----------
async function renderGallery(){
  // optional share-group filter: #/gallery?g=grp_abc  (via query in hash)
  const groupMatch = location.hash.match(/[?&]g=([^&]+)/);
  const group = groupMatch ? decodeURIComponent(groupMatch[1]) : null;
  loading("Finding caregivers for you…");
  try{
    let snap;
    if (group){
      snap = await getDocs(query(collection(db, COLLECTION), where("published","==",true), where("shareGroup","==",group)));
    } else {
      snap = await getDocs(query(collection(db, COLLECTION), where("published","==",true)));
    }
    const profiles = [];
    snap.forEach(d => profiles.push({ id:d.id, ...d.data() }));
    profiles.sort((a,b)=>(a.order??999)-(b.order??999) || (b.rating||0)-(a.rating||0));
    if (!profiles.length){ errorMsg("No caregiver profiles are available right now."); return; }

    const trials = profiles.filter(p => p.trialOffer);
    const featured = profiles.filter(p => p.featured);

    // Infinite-loop ticker announcing any trial offers
    const tickerText = trials.length
      ? trials.map(t => `✨ Limited trial — 4 hours with ${esc(t.name)}${t.trialDiscount?(" at "+esc(t.trialDiscount)):" at a special rate"}. Request today!`).join("      •      ")
      : "";
    const ticker = trials.length ? `
      <div class="mb-6 rounded-full overflow-hidden" style="background:var(--ink)">
        <div style="display:flex;white-space:nowrap;overflow:hidden">
          <div style="display:inline-flex;gap:3rem;padding:9px 0;animation:ticker 22s linear infinite;color:var(--gold);font-weight:600;font-size:13px">
            <span>${tickerText}</span><span>${tickerText}</span>
          </div>
        </div>
      </div>` : "";

    // Featured cards strip
    const featuredSection = featured.length ? `
      <section class="mb-8">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xs font-bold tracking-[.14em] uppercase px-2.5 py-1 rounded-full" style="background:var(--gold);color:var(--ink)">★ Featured this week</span>
        </div>
        <div class="grid gap-5" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">
          ${featured.map((p,i)=>cardHTML(p,i,true)).join("")}
        </div>
      </section>` : "";

    app_el.innerHTML = `
      ${ticker}
      <section class="fade-in mb-8 rounded-3xl px-7 py-10 sm:px-10 sm:py-12" style="background:linear-gradient(135deg, var(--cream) 0%, var(--sage-soft) 100%);border:1px solid var(--line)">
        <div class="inline-flex items-center gap-2 text-xs font-bold tracking-[.14em] uppercase mb-4 px-3 py-1 rounded-full" style="background:var(--gold-soft);color:var(--gold-deep)">
          <span>♥</span> Handpicked for your family
        </div>
        <h1 class="display font-bold leading-[1.04]" style="font-size:clamp(2rem,5vw,3.4rem);color:var(--ink)">
          Caregivers you can<br><span style="color:var(--sage)">trust with your loved ones.</span>
        </h1>
        <p class="mt-4 max-w-xl text-[15px] leading-relaxed" style="color:var(--muted)">
          Every professional below is personally verified by the Valeo team. Browse their experience, skills, and what families say, then tell us who feels right and we'll take care of the rest.
        </p>
      </section>
      ${featuredSection}
      ${featured.length?`<div class="text-xs font-bold tracking-[.14em] uppercase mb-3" style="color:var(--muted)">All caregivers</div>`:""}
      <div class="stagger grid gap-5" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">
        ${profiles.map((p,i)=>cardHTML(p,i)).join("")}
      </div>`;
    // stagger timing
    [...app_el.querySelectorAll(".stagger > *")].forEach((el,i)=>el.style.animationDelay=(i*60)+"ms");
  }catch(e){
    console.error(e);
    errorMsg("We couldn't load caregiver profiles. Please check the link or try again shortly.");
  }
}

function cardHTML(p,i,inFeatured){
  const photo = p.photoUrl
    ? `<img src="${esc(p.photoUrl)}" alt="${esc(p.name)}" class="w-full h-full object-cover" loading="lazy" />`
    : `<div class="w-full h-full flex items-center justify-center display text-4xl" style="background:var(--sage-soft);color:var(--sage)">${esc((p.name||"?").slice(0,1))}</div>`;
  const skills = (p.skills||[]).slice(0,3).map(s=>`<span class="skill-chip text-[11px] px-2 py-0.5 rounded-full">${esc(s)}</span>`).join(" ");
  const trialRibbon = p.trialOffer ? `<span class="absolute top-3 left-3 text-[11px] font-bold px-2 py-1 rounded-full" style="background:var(--gold);color:var(--ink)">✨ Trial ${p.trialDiscount?esc(p.trialDiscount):"offer"}</span>` : "";
  return `<div class="card-wrap relative">
    <label class="sel-check" onclick="event.stopPropagation()" title="Select to request together">
      <input type="checkbox" class="sel-box" data-id="${esc(p.id)}" data-name="${esc(p.name)}" onchange="toggleSelect(this)" />
      <span class="sel-mark">✓</span>
    </label>
    <a href="#/p/${encodeURIComponent(p.id)}" class="card-lift block rounded-2xl overflow-hidden bg-white" style="border:1px solid ${p.trialOffer?'var(--gold)':'var(--line)'};text-decoration:none">
    <div class="relative" style="aspect-ratio:4/3;background:var(--sage-soft)">
      ${photo}
      ${trialRibbon}
      ${p.verified?`<span class="absolute top-3 right-3 text-[11px] font-bold px-2 py-1 rounded-full" style="background:var(--ink);color:var(--gold)">✓ Valeo Verified</span>`:""}
    </div>
    <div class="p-4">
      <div class="flex items-center justify-between gap-2">
        <div class="display font-bold text-lg leading-tight" style="color:var(--ink)">${esc(p.name)}</div>
        ${p.rating?`<div class="text-sm font-semibold whitespace-nowrap">${stars(p.rating)} <span style="color:var(--muted)">${(p.rating).toFixed(1)}</span></div>`:""}
      </div>
      ${p.headline?`<div class="text-[13px] mt-0.5" style="color:var(--muted)">${esc(p.headline)}</div>`:""}
      <div class="flex flex-wrap gap-1.5 mt-3">${skills}</div>
      <div class="mt-4 text-sm font-semibold" style="color:var(--gold-deep)">View full profile →</div>
    </div>
  </a></div>`;
}

// ---------- INDIVIDUAL PROFILE ----------
async function renderProfile(id){
  loading("Opening profile…");
  try{
    const snap = await getDoc(doc(db, COLLECTION, id));
    if (!snap.exists() || snap.data().published !== true){ errorMsg("This profile isn't available."); return; }
    const p = { id:snap.id, ...snap.data() };
    const photo = p.photoUrl
      ? `<img src="${esc(p.photoUrl)}" alt="${esc(p.name)}" class="w-full h-full object-cover" />`
      : `<div class="w-full h-full flex items-center justify-center display text-6xl" style="background:var(--sage-soft);color:var(--sage)">${esc((p.name||"?").slice(0,1))}</div>`;
    const skills = (p.skills||[]).map(s=>`<span class="skill-chip text-sm px-3 py-1 rounded-full">${esc(s)}</span>`).join(" ");
    const langs = (p.languages||[]).join(" · ");
    const feedback = (p.feedback||[]).map(f=>`
      <div class="rounded-2xl p-4 bg-white" style="border:1px solid var(--line)">
        <div class="text-sm mb-2">${stars(f.stars||5)}</div>
        <div class="text-[15px] leading-relaxed" style="color:var(--ink)">“${esc(f.text)}”</div>
        <div class="text-xs mt-2" style="color:var(--muted)">— ${esc(f.author||"A Valeo family")}</div>
      </div>`).join("");
    const availability = (p.availability||[]).map(a=>`
      <div class="flex items-start gap-3 py-2" style="border-bottom:1px solid var(--line)">
        <div class="w-14 font-semibold text-sm" style="color:var(--ink)">${esc(a.day)}</div>
        <div class="flex flex-wrap gap-1.5">${(a.slots||[]).map(s=>`<span class="text-[12px] px-2 py-0.5 rounded-md" style="background:var(--sage-soft);color:var(--sage)">${esc(s)}</span>`).join("")||'<span class="text-sm" style="color:var(--muted)">—</span>'}</div>
      </div>`).join("");

    app_el.innerHTML = `
    <article class="fade-in grid gap-8 lg:grid-cols-[340px_1fr]">
      <!-- left: photo + quick facts -->
      <aside>
        <div class="rounded-3xl overflow-hidden" style="aspect-ratio:1;border:1px solid var(--line);background:var(--sage-soft)">${photo}</div>
        <div class="mt-4 rounded-2xl p-4 bg-white" style="border:1px solid var(--line)">
          ${p.rating?`<div class="flex items-center justify-between mb-3"><span style="color:var(--muted)" class="text-sm">Rating</span><span class="font-semibold">${stars(p.rating)} ${(p.rating).toFixed(1)} <span style="color:var(--muted)" class="text-xs">(${p.ratingCount||0})</span></span></div>`:""}
          ${p.experienceYears?`<div class="flex items-center justify-between mb-3"><span style="color:var(--muted)" class="text-sm">Experience</span><span class="font-semibold">${esc(p.experienceYears)} years</span></div>`:""}
          ${p.city?`<div class="flex items-center justify-between mb-3"><span style="color:var(--muted)" class="text-sm">Based in</span><span class="font-semibold">${esc(p.city)}</span></div>`:""}
          ${langs?`<div class="flex items-center justify-between"><span style="color:var(--muted)" class="text-sm">Languages</span><span class="font-semibold text-sm">${esc(langs)}</span></div>`:""}
        </div>
        <button id="req-btn" onclick="requestCaregiver('${esc(p.id)}','${esc(p.name)}')" class="btn-primary w-full mt-4 rounded-xl py-3 font-semibold">Request this caregiver</button>
        <p class="text-[11px] text-center mt-2" style="color:var(--muted)">Our team will confirm availability with you.</p>
        ${ADMIN_MODE?`<button onclick="unpublishProfile('${esc(p.id)}','${esc(p.name)}')" class="w-full mt-2 rounded-xl py-2 text-sm font-semibold" style="background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.3)">✕ Remove from public gallery (staff)</button>`:""}
      </aside>

      <!-- right: story -->
      <div>
        <div class="flex items-center gap-2 mb-2">
          ${p.verified?`<span class="text-[11px] font-bold px-2 py-1 rounded-full" style="background:var(--sage-soft);color:var(--sage)">✓ Verified by Valeo</span>`:""}
        </div>
        <h1 class="display font-bold leading-tight" style="font-size:clamp(2rem,4vw,2.8rem);color:var(--ink)">${esc(p.name)}</h1>
        ${p.headline?`<p class="text-lg mt-1" style="color:var(--sage)">${esc(p.headline)}</p>`:""}
        ${p.bio?`<p class="mt-5 text-[16px] leading-relaxed" style="color:var(--ink)">${esc(p.bio)}</p>`:""}

        ${skills?`<h2 class="display font-semibold text-xl mt-8 mb-3">Skills &amp; strengths</h2><div class="flex flex-wrap gap-2">${skills}</div>`:""}

        ${availability?`<h2 class="display font-semibold text-xl mt-8 mb-2">Typical availability</h2><div class="rounded-2xl p-4 bg-white" style="border:1px solid var(--line)">${availability}</div><p class="text-xs mt-2" style="color:var(--muted)">Availability is indicative; we confirm exact slots when you book.</p>`:""}

        ${feedback?`<h2 class="display font-semibold text-xl mt-8 mb-3">What families say</h2><div class="grid gap-3 sm:grid-cols-2">${feedback}</div>`:""}
      </div>
    </article>`;
  }catch(e){
    console.error(e);
    errorMsg("We couldn't open this profile. Please check your link.");
  }
}

router();
</script>
</body>
</html>
